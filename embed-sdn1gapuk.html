              contact: { title: 'Contact & Visit Us', description: 'We are always happy to hear from you. Please contact us for more information regarding registration or school visits.', address: 'School Address', phone: 'Phone & WhatsApp', email: 'Official Email', sendMessage: 'Send Message', formName: 'Full Name', formEmail: 'Your Email', formSubject: 'Subject', formMessage: 'Your Message...', sendButton: 'Send Now', sending: 'Processing...', success: 'Thank you! Your message has been prepared in your email app.' },
              footer: { copyright: '© 2026 SD Negeri 1 Gapuk. All rights reserved.' }

          const [selectedGalleryImage, setSelectedGalleryImage] = useState(null);
          const [isRegistrationOpen, setIsRegistrationOpen] = useState(false);
          const [isAllNewsOpen, setIsAllNewsOpen] = useState(false);

            studentName: '',
            birthPlace: '',
            birthDate: '',
            parentName: '',
            whatsapp: '',
            address: ''
          });

            const handleScroll = () => setScrolled(window.scrollY > 20);
            window.addEventListener('scroll', handleScroll);

            // Subscribe to Firebase
            const unsubNews = onSnapshot(query(collection(db, 'news'), orderBy('date', 'desc')), (snap) => {
              setNewsData(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
            });
            const unsubGallery = onSnapshot(collection(db, 'gallery'), (snap) => {
              setGalleryData(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
            });
            const unsubSchedules = onSnapshot(collection(db, 'schedules'), (snap) => {
              const data = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              setScheduleData(data);
              
              // Automatically select the first available grade if current selection is not in data
              const uniqueGrades = [...new Set(data.map(s => s.grade))].sort();
              if (uniqueGrades.length > 0 && (!selectedGrade || !uniqueGrades.includes(selectedGrade))) {
                setSelectedGrade(uniqueGrades[0]);
              }
            });
            const unsubExtras = onSnapshot(collection(db, 'extracurriculars'), (snap) => {
              setExtraData(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
            });
            const unsubStats = onSnapshot(doc(db, 'settings/stats'), (snap) => {
              if (snap.exists()) setStats(snap.data());
            });
            const unsubProfile = onSnapshot(doc(db, 'settings/profile'), (snap) => {
              if (snap.exists()) setProfile(snap.data());
            });

            return () => {
              window.removeEventListener('scroll', handleScroll);
              unsubNews(); unsubGallery(); unsubSchedules(); unsubExtras(); unsubStats(); unsubProfile();

                        <p className="text-slate-600 leading-relaxed italic">"{profile.vision}"</p>

                        <ul className="space-y-3 text-slate-600">
